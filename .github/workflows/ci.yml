name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Quality (typecheck + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VOC-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: VOC-api/package-lock.json

      - run: npm ci

      - run: cp .env.example .env

      - run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  integration:
    name: Integration (PostgreSQL + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voc
          POSTGRES_PASSWORD: voc_local
          POSTGRES_DB: voc_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U voc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: VOC-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: VOC-api/package-lock.json

      - run: npm ci

      - run: cp .env.example .env

      - run: npx prisma generate

      - name: Integration tests
        run: npm run test:integration

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t voc-api:ci ./VOC-api

      - name: Validate entrypoint (migrate deploy before boot)
        run: |
          docker build -t voc-api:ci-test --target runner ./VOC-api
          test -x ./VOC-api/docker-entrypoint.sh

  smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: [quality, integration, docker]

    env:
      JWT_SECRET: ci-smoke-jwt-secret-01234567890123456789012345678901

    steps:
      - uses: actions/checkout@v4

      - name: Boot stack
        run: docker compose up -d --build
        working-directory: VOC-api

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3333/health/ready > /dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become ready"
          docker compose logs api
          exit 1
        working-directory: VOC-api

      - name: Run smoke
        run: docker compose exec -T api node dist/smoke/smoke.js

      - name: Tear down
        if: always()
        run: docker compose down -v
        working-directory: VOC-api

  frontend:
    name: Frontend (VOC)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VOC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: VOC/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build